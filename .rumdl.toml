#:schema https://raw.githubusercontent.com/rvben/rumdl/main/rumdl.schema.json
# rumdl configuration — https://rumdl.dev/global-settings/

[global]
# No hard line-length limit — project convention: break at logical points only
disable = [
  "MD013",  # line length: no hard limit per project convention
  "MD057",  # relative links in .github/copilot-skills use paths rumdl can't resolve
  "MD051",  # link fragments in .github/ skill files reference external targets
]
respect-gitignore = true

# Exclude generated/build output (gitignored dirs also excluded via respect-gitignore)
exclude = [
  "node_modules/**",
  "dist/**",
  ".astro/**",
  ".vercel/**",
  "public/**",           # JSON data copies (generated by prebuild)
  "src/content/docs/**", # Markdown content (generated by prebuild)
]

[MD003]
style = "atx"  # ATX-style headings (## Heading)

[MD007]
indent = 2  # 2-space indentation for nested lists (project convention)

# ── Per-file rule overrides ────────────────────────────────────────────────────

[per-file-ignores]
# books/ and cleaned-references/: game content has intentional structural patterns
# that differ from generic docs — but all fixable whitespace/formatting IS enforced
"{books,cleaned-references}/**/*.{md,mdx}" = [
  "MD024",  # duplicate headings: same feat/ability/class names intentionally repeat across sections
  "MD033",  # inline HTML: editorial comments <!-- ... --> are explicitly permitted
  "MD036",  # emphasis as heading: bold labels like **Special:**, **Prerequisites:** are game notation
  "MD076",  # mixed bold+italic (***term***): used for critical rules/abilities in game content
]

# cleaned-references/: Starlight front matter is injected by prebuild, not authored manually
"cleaned-references/**/*.{md,mdx}" = [
  "MD025",  # multiple H1: 06-Classes.md intentionally contains one H1 per class (logical grouping)
  "MD041",  # first line heading: prebuild injects front matter before H1
]

# docs/: project documentation — relax first-line heading requirement
"docs/**/*.md" = [
  "MD041",  # first line heading (many docs don't start with a heading)
]

# Root markdown files (README, etc.)
"*.md" = [
  "MD041",  # README/CHANGELOG may start with badges or description
]
