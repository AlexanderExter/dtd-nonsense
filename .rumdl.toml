#:schema https://raw.githubusercontent.com/rvben/rumdl/main/rumdl.schema.json
# rumdl configuration — https://rumdl.dev/global-settings/

[global]
# No hard line-length limit — project convention: break at logical points only
disable = [
  "MD013",  # line length: no hard limit per project convention
  "MD026",  # trailing punctuation in headings: game content has "Ramming Speed!", "WAAAAAGH CRY!"
  "MD057",  # relative links in .github/copilot-skills use paths rumdl can't resolve
  "MD051",  # link fragments in .github/ skill files reference external targets
  "MD075",  # orphaned table rows: stat blocks use separate tables with headings between them
]
respect_gitignore = true

# Exclude generated/build output (gitignored dirs also excluded via respect_gitignore)
exclude = [
  "node_modules/**",
  "dist/**",
  ".astro/**",
  ".vercel/**",
  ".rumdl_cache/**",
  "public/**",           # JSON data copies (generated by prebuild)
  "src/content/docs/**", # Markdown content (generated by prebuild)
]

# ── Flavor detection ──────────────────────────────────────────────────────────

[per-file-flavor]
"**/*.mdx" = "mdx"  # All .mdx files use MDX flavor (JSX components, ESM imports)

# ── Rule configuration ─────────────────────────────────────────────────────────

[MD003]
style = "atx"  # ATX-style headings (## Heading)

[MD007]
indent = 2  # 2-space indentation for nested lists (project convention)

# ── Per-file rule overrides ────────────────────────────────────────────────────

[per-file-ignores]
# books/: source material with intentional structural patterns
# Multi-H1 per file (one per major section), blockquotes with multi-paragraph game text,
# and `---` horizontal rules that rumdl misidentifies as frontmatter delimiters.
"books/**/*.{md,mdx}" = [
  "MD011",  # reversed link: game stat notation uses (value)[qualifier] patterns
  "MD024",  # duplicate headings: same feat/ability/class names intentionally repeat
  "MD025",  # multiple H1: each chapter file contains multiple top-level sections
  "MD028",  # blank line inside blockquote: multi-paragraph game text in blockquotes
  "MD033",  # inline HTML: editorial comments <!-- ... --> are explicitly permitted
  "MD036",  # emphasis as heading: bold labels like **Special:**, **Prerequisites:**
  "MD071",  # blank line after frontmatter: `---` are horizontal rules, not frontmatter
  "MD076",  # list item spacing: mixed tight/loose lists in game content
]

# cleaned-references/: condensed reference docs with similar content patterns
"cleaned-references/**/*.{md,mdx}" = [
  "MD024",  # duplicate headings: feat/class names repeat across sections
  "MD025",  # multiple H1: 06-Classes.md has one H1 per class
  "MD033",  # inline HTML: editorial comments permitted
  "MD036",  # emphasis as heading: bold game notation labels
  "MD041",  # first line heading: prebuild injects front matter before H1
  "MD076",  # list item spacing: game content patterns
]

# docs/: project documentation — relax first-line heading requirement
"docs/**/*.md" = [
  "MD041",  # first line heading (many docs don't start with a heading)
]

# Root markdown files (README, etc.)
"*.md" = [
  "MD041",  # README/CHANGELOG may start with badges or description
]
