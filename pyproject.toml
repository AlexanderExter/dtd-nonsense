[project]
name = "dtd-pipeline"
version = "0.1.0"
description = "Data pipeline and content tools for Dungeons the Dragoning 40,000"
readme = "docs/pipeline.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "pydantic>=2.10",
    "click>=8.1",
    "rich>=13.0",
    "python-frontmatter>=1.1",
    "pymupdf>=1.25",
]

[project.scripts]
dtd = "pipeline.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
