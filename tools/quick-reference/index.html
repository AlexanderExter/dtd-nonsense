<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quick Reference — DTD 40k Tools</title>
        <link rel="stylesheet" href="../shared/css/dtd-theme.css" />
        <link rel="stylesheet" href="quick-reference.css" />
    </head>
    <body>
        <div class="qref-app">
            <header class="qref-header no-print">
                <h1>Quick Reference <a href="../index.html">← Tools</a></h1>
                <div class="search-row">
                    <input type="search" id="searchInput" placeholder="Search actions, conditions, modifiers, schools…" autocomplete="off" />
                </div>
                <div class="search-hint"><kbd>/</kbd> or <kbd>Ctrl+K</kbd> to focus &middot; <kbd>Esc</kbd> to clear</div>
            </header>

            <div class="controls no-print">
                <button class="btn btn-ghost" id="expandAll">Expand All</button>
                <button class="btn btn-ghost" id="collapseAll">Collapse All</button>
            </div>

            <div class="qref-layout">
                <aside class="qref-sidebar" id="sidebarContainer"></aside>
                <main id="sectionsContainer"></main>
            </div>

            <footer style="text-align: center; padding: var(--space-lg); color: var(--text-dim); font-size: 0.8rem">
                Data from <em>Dungeons the Dragoning 40,000: 7th Edition</em> and <em>For a Few Subtitles More</em>.
            </footer>
        </div>

        <script src="quick-reference.js"></script>
    </body>
</html>
