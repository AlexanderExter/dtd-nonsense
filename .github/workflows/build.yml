name: Build
on: [push, pull_request]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            # --- Bun (package manager + test runner + pipeline scripts) ---
            # Version is read from .bun-version (single source of truth).
            # Dependabot keeps .bun-version up to date via the 'bun' ecosystem.
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: ".bun-version"
            - run: bun install

            # --- Node (needed for Astro build) ---
            - uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'

            # --- Checks (mirrors local `bun run check` for pipeline parity) ---
            - run: bun test
            - run: bunx biome ci .
            - run: bun run scripts/validate.ts --xref
            - run: bun run scripts/lint.ts
            - run: bun run scripts/sync-check.ts
            - run: bun run knip
            - run: bun run check:deps
            - run: bun run check:structure

            # --- Build ---
            - run: bun run build
