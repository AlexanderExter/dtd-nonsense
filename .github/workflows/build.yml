name: Build
on: [push, pull_request]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # --- Node / Astro ---
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npx biome ci .
            - run: npm run test
            - run: npm run build

            # --- Python pipeline ---
            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: uv sync --group dev
            - run: uv run ruff check .
            - run: uv run dtd validate
            - run: uv run dtd lint
