name: Build
on: [push, pull_request]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # --- Bun (package manager + test runner + pipeline scripts) ---
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install

            # --- Node / Astro build ---
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - run: bunx biome ci .
            - run: bun test
            - run: bun run scripts/validate.ts --xref
            - run: bun run scripts/lint.ts
            - run: bun run build
